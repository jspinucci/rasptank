<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RaspTank Control</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <h2>RaspTank Control System</h2>

    <!-- ========================= -->
    <!-- CAMERA WINDOW -->
    <!-- ========================= -->
    <div class="section">
        <h3>Camera Feed</h3>
        <img id="cameraFeed" style="width: 320px; height: 240px; border: 2px solid #444;">
    </div>

    <!-- ========================= -->
    <!-- CAMERA PAN/TILT JOYSTICK -->
    <!-- ========================= -->
    <div class="section">
        <h3>Camera Pan/Tilt</h3>

        <div id="camJoy" class="joystick">
            <div id="camStick" class="stick"></div>
        </div>

        <!-- Single button: centers servos AND F/G sliders -->
        <button onclick="centerCamera()">Center Camera</button>
    </div>

    <!-- ========================= -->
    <!-- CAMERA SERVO SLIDERS (F–G) -->
    <!-- ========================= -->
    <div class="section">
        <h3>Camera Servo Sliders (F–G)</h3>

        <label>Servo F (Pan)</label><br>
        <input id="servoF" type="range" min="-90" max="90" value="0"><br><br>

        <label>Servo G (Tilt)</label><br>
        <input id="servoG" type="range" min="-45" max="45" value="0"><br><br>
    </div>

    <!-- ========================= -->
    <!-- TANK DRIVE JOYSTICK -->
    <!-- ========================= -->
    <div class="section">
        <h3>Tank Drive</h3>

        <div id="tankJoy" class="joystick">
            <div id="tankStick" class="stick"></div>
        </div>

        <button onclick="stopTank()">Stop</button>
    </div>

    <!-- ========================= -->
    <!-- ARM SERVO SLIDERS (A–E) -->
    <!-- ========================= -->
    <div class="section">
        <h3>Arm Servos (A–E)</h3>

        <label>Servo A</label><br>
        <input id="servoA" type="range" min="0" max="180" value="90"><br><br>

        <label>Servo B</label><br>
        <input id="servoB" type="range" min="0" max="180" value="90"><br><br>

        <label>Servo C</label><br>
        <input id="servoC" type="range" min="0" max="180" value="90"><br><br>

        <label>Servo D</label><br>
        <input id="servoD" type="range" min="0" max="180" value="90"><br><br>

        <label>Servo E</label><br>
        <input id="servoE" type="range" min="0" max="180" value="90"><br><br>

        <!-- Single button: centers servos AND A–E sliders -->
        <button onclick="centerArm()">Center Arm</button>
    </div>

    <script src="/static/js/joystick.js"></script>
    <script src="/static/js/servos.js"></script>
    <script src="/static/js/control.js"></script>

</body>
</html>
